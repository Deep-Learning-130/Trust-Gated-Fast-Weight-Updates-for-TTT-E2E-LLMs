# CPU test suite. TEAM_PLAN P0-6 / task-allocation T3.1.
#
# The suite is the fast feedback loop and must run anywhere, so this job installs
# no CUDA, fetches no checkpoint and touches no dataset.
#
# The vendor submodule is deliberately NOT checked out. It carries no licence
# (ADR-002) and the CPU tests neither need nor can import it -- `einops`, `zarr`,
# `grain`, `orbax`, `wandb` and `hydra` are all absent by design, which is why
# `tests/test_interceptor.py` and `tests/test_carry.py` test against stand-ins
# for the vendor surface rather than the real `MetaModel`.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml; 3.13 is what the project
        # is developed on. Bracketing both catches version-specific breakage.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # ADR-002 -- unlicensed vendor tree, never fetched here

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Dependencies only -- the project itself is not installed. `PYTHONPATH=src`
      # is the documented invocation, and installing a second copy into
      # site-packages would make it ambiguous which `trustgate` was imported.
      # `eval/prereg.py` resolves PREREGISTERED.md relative to its own __file__,
      # so importing the wrong copy would break the threshold pin silently.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jax>=0.4.30" "equinox>=0.11" "optax>=0.2" "numpy>=1.26" "pytest>=8.0"

      - name: Run CPU tests
        env:
          PYTHONPATH: src
          JAX_PLATFORMS: cpu
        run: python -m pytest -q

  hygiene:
    # Mechanises review checks 1 and 4 from docs/protocols/branch-and-review.md,
    # which are described there as non-negotiable but were enforced only by a
    # human remembering to look.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: No vendor tree contents committed
        run: |
          # The submodule pointer is fine; actual files inside it are not.
          if git ls-files --error-unmatch 'vendor/ttt-e2e/*' >/dev/null 2>&1; then
            echo "::error::files inside vendor/ttt-e2e are tracked -- ADR-002 forbids editing or vendoring the unlicensed tree"
            git ls-files 'vendor/ttt-e2e/*'
            exit 1
          fi
          echo "ok: no vendor tree contents tracked"

      - name: No secrets, checkpoints, datasets or results tracked
        run: |
          status=0
          # Patterns that are git-ignored on purpose. Anything here got in via
          # `git add -f` or a path the ignore rules do not cover.
          while read -r pattern; do
            hits=$(git ls-files "$pattern")
            if [ -n "$hits" ]; then
              echo "::error::tracked files match forbidden pattern '$pattern':"
              echo "$hits"
              status=1
            fi
          done <<'PATTERNS'
          *.npy
          *.msgpack
          .env
          checkpoints/**
          experiments/*/results/**
          wandb/**
          PATTERNS
          if [ "$status" -eq 0 ]; then echo "ok: nothing forbidden is tracked"; fi
          exit "$status"

      - name: Phase 2 scope matches the PREREGISTERED.md revision
        run: |
          # This check USED to assert that all six Phase 2 files still raised
          # NotImplementedError, enforcing Standing Rule 2: no gate/ code before
          # the Phase 1 spike returns PROCEED, because it is sunk cost if the
          # verdict is STOP.
          #
          # That rule was set aside by a dated, signed revision to
          # experiments/001-attack-spike/PREREGISTERED.md (2026-09-20, Manas
          # Maahir), which records the decision, who made it, and what it costs.
          # The revision is the authority for this change; if you are reading
          # this because the check surprised you, read that first.
          #
          # The check did not go away, it inverted. Two files must STILL be
          # stubbed, and the implemented ones must actually import -- a stub
          # that was deleted rather than implemented would otherwise pass a
          # grep-based check silently.
          status=0

          # Option C is an offline auditor by design (ADR-F1). The MedBN
          # baseline needs per-example gradients the vendor's inner_loop_step
          # does not produce, and medbn-diff.md requires it be tuned as hard as
          # our own gate -- so it is deferred, not forgotten.
          for f in src/trustgate/gate/influence.py \
                   src/trustgate/baselines/medbn_analogue.py; do
            if ! grep -q "NotImplementedError" "$f"; then
              echo "::error::$f no longer raises NotImplementedError -- it is deliberately out of Phase 2 scope; if that changed, say so in an ADR"
              status=1
            fi
          done

          # The implemented four. Importing is the check that matters: it is
          # what a grep cannot fake.
          if ! PYTHONPATH=src JAX_PLATFORMS=cpu python -c "
          from trustgate.gate import anchor_consistency_gate, combine, probe_divergence, uncertainty_gate
          from trustgate.probes.rotating import make_probe_rotation
          from trustgate.eval.overhead import measure_overhead
          "; then
            echo "::error::the implemented Phase 2 surface does not import"
            status=1
          fi

          # The bounded-drift property is still NOT enforced: the vendor scan
          # carry has no slot for DriftState (ADR-003 correction, ADR-P3-1).
          # policy.py must keep saying so, or the disclosure overclaims.
          if ! grep -q "WHAT DOES NOT WORK YET" src/trustgate/gate/policy.py; then
            echo "::error::policy.py dropped its note that drift is not enforced -- ADR-003 forbids describing it as enforced"
            status=1
          fi

          if [ "$status" -eq 0 ]; then echo "ok: Phase 2 scope matches the revision"; fi
          exit "$status"

      - name: Both pre-push guards allow the same remotes
        run: |
          # The guard's own comment says adding a remote "IS the decision ... a
          # reviewed change to a tracked file". That argument only holds while
          # there is one list. There are now two -- a POSIX guard and a
          # PowerShell one for Windows -- and nothing stops a remote being
          # recorded in one and not the other, which would leave whichever
          # developer runs the other guard silently unprotected.
          #
          # Extract the github.com patterns from each and compare as sets.
          sh_list=$(grep -oE "github\\\\\.com\[[^]]*\]\+[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+" \
                      scripts/pre-push-guard.sh | sort -u)
          ps_list=$(grep -oE "github\\\\\.com\[[^]]*\]\+[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+" \
                      scripts/pre-push-guard.ps1 | sort -u)

          if [ -z "$sh_list" ] || [ -z "$ps_list" ]; then
            echo "::error::could not extract a remote allowlist from one of the guards"
            echo "--- pre-push-guard.sh ---"; echo "$sh_list"
            echo "--- pre-push-guard.ps1 ---"; echo "$ps_list"
            exit 1
          fi

          if [ "$sh_list" != "$ps_list" ]; then
            echo "::error::pre-push-guard.sh and .ps1 disagree about which remotes are decided"
            diff <(echo "$sh_list") <(echo "$ps_list") || true
            exit 1
          fi
          echo "ok: both guards allow the same remotes"
          echo "$sh_list"
