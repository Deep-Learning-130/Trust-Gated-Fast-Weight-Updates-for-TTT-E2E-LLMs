[project]
name = "trustgate"
version = "0.0.1"
description = "Trust-gated fast-weight updates for TTT-E2E LLMs (public since 2026-08-01 -- see DISCLOSURE.md)"
requires-python = ">=3.11"

# Overlay package. The heavy JAX/CUDA stack is provided by the vendored
# submodule (vendor/ttt-e2e/pyproject.toml); we do not re-declare it here to
# avoid version drift against the pinned SHA. `equinox`/`optax` are named
# because trustgate imports them directly and its CPU tests depend on them.
dependencies = [
    "jax>=0.4.30",
    "equinox>=0.11",
    "optax>=0.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# Fluency scoring against the independent reference model (T3.2). Deliberately
# tiny: `gpt2_reference.py` implements the forward pass on the jax stack that is
# already a core dependency, so no second array framework is pulled in. In
# particular **neither `torch` nor `transformers` nor `flax` is required** --
# `transformers` 5.x dropped Flax models, and implementing GPT-2 turned out
# cheaper than depending on either replacement.
#
# Both imports are lazy (inside functions), so the CPU test suite imports and
# exercises `eval/fluency.py` with fakes without either package installed. That
# is what keeps CI network-free and dependency-free.
fluency = [
    "safetensors>=0.4",
    "tokenizers>=0.19",
]

# Figure and table generation (`scripts/make_figures.py`). Tooling, not runtime:
# nothing under `src/` imports matplotlib, and the CPU test suite does not need
# it. The paper itself consumes the generated pgfplots `.tex` fragments rather
# than the PNGs, so a LaTeX build needs neither this extra nor the images.
figures = [
    "matplotlib>=3.8",
]

# Only `scripts/acceptance_fluency_reference.py` needs this, to read the
# WikiText test split. Not imported by anything under `src/`.
acceptance = [
    "pyarrow>=15",
]

# Verification only. `scripts/verify_gpt2_equivalence.py` and one opt-in test
# compare our jax GPT-2 forward pass against HuggingFace's implementation --
# that equivalence is the *primary* acceptance evidence for the fluency
# reference model (FLUENCY_REFERENCE.md), because the published-perplexity check
# T3.2 specified turned out undecidable.
#
# Nothing under `src/` imports either package, and neither is needed to score
# fluency. Installing torch here does not contradict the design decision to keep
# it out of the runtime -- it is the yardstick, not the tool.
#
#     uv pip install --python .venv -e ".[verify]" \
#         --extra-index-url https://download.pytorch.org/whl/cpu
verify = [
    "torch>=2.2",
    "transformers>=4.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# CPU-only, tiny pytrees. No GPU, no checkpoints. Keep it that way -- these
# tests are the fast feedback loop that must stay runnable anywhere.
addopts = "-q"

[tool.uv]
# The vendor submodule is developed against its own uv.lock. Install it
# separately (scripts/setup_vendor.sh); do not fold it into this project's lock.
package = true

[tool.uv.sources]
# Placeholder: point at the vendored tree for editable installs during
# integration work. Left commented until the GPU environment is provisioned.
# ttt = { path = "vendor/ttt-e2e", editable = true }
