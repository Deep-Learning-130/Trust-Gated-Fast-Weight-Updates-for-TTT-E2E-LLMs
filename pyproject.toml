[project]
name = "trustgate"
version = "0.0.1"
description = "Trust-gated fast-weight updates for TTT-E2E LLMs (public since 2026-08-01 -- see DISCLOSURE.md)"
requires-python = ">=3.11"

# Overlay package. The heavy JAX/CUDA stack is provided by the vendored
# submodule (vendor/ttt-e2e/pyproject.toml); we do not re-declare it here to
# avoid version drift against the pinned SHA. `equinox`/`optax` are named
# because trustgate imports them directly and its CPU tests depend on them.
dependencies = [
    "jax>=0.4.30",
    "equinox>=0.11",
    "optax>=0.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# CPU-only, tiny pytrees. No GPU, no checkpoints. Keep it that way -- these
# tests are the fast feedback loop that must stay runnable anywhere.
addopts = "-q"

[tool.uv]
# The vendor submodule is developed against its own uv.lock. Install it
# separately (scripts/setup_vendor.sh); do not fold it into this project's lock.
package = true

[tool.uv.sources]
# Placeholder: point at the vendored tree for editable installs during
# integration work. Left commented until the GPU environment is provisioned.
# ttt = { path = "vendor/ttt-e2e", editable = true }
